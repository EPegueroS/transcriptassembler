name: CMSCAN
description: Search sequences against a covariance model database for ncRNA annotation
keywords:
  - infernal
  - cmscan
  - ncRNA
  - Rfam
  - covariance model
tools:
  - infernal:
      description: Inference of RNA alignments using covariance models
      homepage: https://github.com/EddyRivasLab/infernal
      documentation: http://eddylab.org/infernal/
      tool_dev_url: https://github.com/EddyRivasLab/infernal
      doi: "10.1093/bioinformatics/btt509"
      licence: ["BSD"]
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - fasta_file:
      type: file
      description: Input FASTA file with sequences to scan
      pattern: "*.{fa,fasta,fna}"
  - clanin_file:
      type: file
      description: Rfam clan information file
      pattern: "*.clanin"
  - cm_file:
      type: file
      description: Compressed covariance model and index files (output of cmpress)
      pattern: "*.cm"
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - output:
      type: file
      description: Detailed cmscan output
      pattern: "*.cmscan"
  - tblout:
      type: file
      description: Tabular cmscan output
      pattern: "*.tblout"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@EPegueroS"
