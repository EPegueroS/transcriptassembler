name: TRANSDECODER_PREDICT
description: Runs TransDecoder.Predict with optional BLASTP homology support via --retain_blastp_hits
keywords:
  - transdecoder
  - transcripts
  - protein prediction
  - ORF
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - fasta:
      type: file
      description: Input transcript FASTA file
      pattern: "*.{fa,fasta,fna}"
  - longorf_dir:
      type: directory
      description: Output directory from TransDecoder.LongOrfs
  - blastp_hits:
      type: file
      description: BLASTP outfmt6 TSV hits for --retain_blastp_hits (optional, pass [] to skip)
      pattern: "*.{tsv,outfmt6}"
output:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - fasta:
      type: file
      description: Input transcript FASTA file (passthrough)
      pattern: "*.{fa,fasta,fna}"
  - pep:
      type: file
      description: Predicted peptide sequences
      pattern: "*.pep"
  - gff:
      type: file
      description: GFF3 file with predicted coding regions
      pattern: "*.gff3"
  - cds:
      type: file
      description: Predicted coding sequences
      pattern: "*.cds"
  - bed:
      type: file
      description: BED file with predicted coding regions
      pattern: "*.bed"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@danilodileo"
